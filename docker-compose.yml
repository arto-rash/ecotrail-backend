# Standalone backend stack (API + PostgreSQL).
# Local:  docker compose up -d --build
# Server: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
services:
  api:
    build:
      context: .
      target: ${APP_BUILD_TARGET:-development}
    env_file: .env
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-ecotrail}
      DB_USERNAME: ${DB_USERNAME:-ecotrail}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      SSL_MODE: "off"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:${WEB_PORT:-3000}}
    ports:
      - "${API_PORT:-8000}:8080"
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-ecotrail}
      POSTGRES_USER: ${DB_USERNAME:-ecotrail}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${DB_FORWARD_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
