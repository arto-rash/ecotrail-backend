# Production overrides: baked image, no bind mount, DB not exposed publicly.
services:
  api:
    build:
      target: production
    restart: unless-stopped
    volumes: !override
      # Community photo uploads survive rebuilds.
      - storage:/var/www/html/storage/app
    ports: !override
      - "127.0.0.1:${API_PORT:-8000}:8080"

  db:
    restart: unless-stopped
    ports: !reset []

volumes:
  storage:
